name: Build and Release .deb Package

on:
  push:
    tags:
      - 'v*.*.*'  # Triggered only when pushing tags in the format v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y dh-python python3-all python3-setuptools python3-stdeb debhelper build-essential python3-psutil python3-distutils
      
      - name: Downgrade setuptools to match server
        run: |
          python3 -m pip install --upgrade pip==22.0.2
          python3 -m pip install setuptools==59.6.0 stdeb==0.10.0

      - name: Show current directory
        run: pwd

      - name: Prepare directory for deb package
        run: mkdir -p release

      - name: List files
        run: ls -la

      - name: Build DEB package
        run: python3 setup.py --command-packages=stdeb.command bdist_deb

      - name: Move built deb package to the release directory
        run: mv deb_dist/*.deb release/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Echo works
        run: echo "works"
