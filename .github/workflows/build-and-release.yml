name: Build and Release .deb Package

on:
  push:
    tags:
      - 'v*.*.*'  # Triggered only when pushing tags in the format v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-stdeb python3-setuptools python3-pip \
                              dh-python python3-all debhelper build-essential
          pip install --upgrade pip
          pip install psutil

      - name: Build DEB package
        run: |
          python3 setup.py --command-packages=stdeb.command bdist_deb
          mkdir -p release
          mv deb_dist/*.deb release/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Echo works
        run: echo "works"
