name: Build and Release .deb Package

on:
  push:
    branches:
      - develop
    # tags:
    #   - 'v*.*.*'  # Triggered only when pushing tags in the format v0.1.0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system build deps
        run: |
          sudo apt update
          sudo apt install -y \
            python3-all \
            build-essential \
            debhelper \
            dh-python \
            devscripts \
            fakeroot

      - name: Install Python build deps
        run: |
          python3 -m pip install --upgrade pip
          pip install --upgrade --force-reinstall "setuptools<60" wheel stdeb
          python3 - <<'EOF'
          import setuptools
          print("setuptools version:", setuptools.__version__)
          EOF


      - name: Build .deb package
        run: python3 setup.py --command-packages=stdeb.command bdist_deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: deb_dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Echo build works
        run: echo "Build works"